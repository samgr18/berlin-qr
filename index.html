<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex">
    <title>Berlín</title>
</head>

<body>

    <p id="mensaje">Redirigiendo...</p>
    <p><a id="enlace" href="#">Continuar</a></p>

    <script>
        fetch("destino.txt?t=" + Date.now())
            .then(response => response.text())
            .then(url => {
                url = url.trim();

                document.getElementById("enlace").href = url;

                window.location.replace(url);
            })
            .catch(() => {
                document.getElementById("mensaje").textContent =
                    "No se pudo abrir el enlace.";
            });
    </script>

</body>
</html>
